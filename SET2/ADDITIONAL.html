
<!DOCTYPE html>
<html>
<head>
    <title>Student Time Table</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

<h2>STUDENT TIME TABLE</h2>

<table>
    <tr>
        <th>DAY</th>
        <th>9:50-10:40</th>
        <th>10:40-11:30</th>
        <th>11:30-12:20</th>
        <th>12:20-1:10</th>
        <th>1:10-1:50</th>
        <th>1:50-2:40</th>
        <th>2:40-3:30</th>
        <th>3:30-4:20</th>
    </tr>

    <tr>
        <th>MON</th>
        <td>WT</td>
        <td>CN</td>
        <td>IP</td>
        <td>HONORS</td>
        <td rowspan="6">LUNCH</td>
        <td>IP</td>
        <td>DAA</td>
        <td>IP</td>
    </tr>

    <tr>
        <th>TUE</th>
        <td>DAA</td>
        <td>CN</td>
        <td>IP</td>
        <td>WT</td>
        <td>DM</td>
        <td>DAA</td>
        <td>DM</td>
    </tr>

    <tr>
        <th>WED</th>
        <td>CN</td>
        <td>IP</td>
        <td>DM</td>
        <td>HONORS</td>
        <td>WT</td>
        <td>CN</td>
        <td>IP</td>
    </tr>

    <tr>
        <th>THU</th>
        <td>DAA</td>
        <td>CN</td>
        <td>IP</td>
        <td>DAA</td>
        <td>WT</td>
        <td>DM</td>
        <td>CN</td>
    </tr>

    <tr>
        <th>FRI</th>
        <td>WT</td>
        <td>CN</td>
        <td>DM</td>
        <td>HONORS</td>
        <td>IP</td>
        <td>DAA</td>
        <td>WT</td>
    </tr>

    <tr>
        <th>SAT</th>
        <td>CN</td>
        <td>IP</td>
        <td>DM</td>
        <td>WT</td>
        <td>DAA</td>
        <td>WT</td>
        <td>CN</td>
    </tr>

</table>

</body>
</html>
